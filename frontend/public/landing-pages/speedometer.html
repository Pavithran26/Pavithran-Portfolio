<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pavithran26 Portfolio Loader</title>
<style>
:root{color-scheme:dark;font-family:Roboto,Inter,ui-sans-serif,system-ui,sans-serif;--green:#34d878;--mint:#baf8d0}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#effff3}
body{display:grid;place-items:center;padding:16px}
.loader{width:100%;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;position:relative;isolation:isolate}
.loader:before{content:"";position:absolute;width:min(76vw,340px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(27,137,72,.22),rgba(4,22,13,.04) 54%,transparent 72%);filter:blur(12px);z-index:-1}
.kinetic{position:relative;display:flex;align-items:center;justify-content:center;transform:scale(.72);transform-origin:center}
.word{display:flex;align-items:center;margin:0;white-space:nowrap;color:#eafff0;font-size:clamp(2.3rem,8vw,3.75rem);font-weight:300;letter-spacing:8px;text-shadow:0 0 24px rgba(52,216,120,.13)}
.letter{display:inline-block;position:relative}
.letter-i{transform-origin:100% 70%;animation:ktl-letterStretch 1800ms cubic-bezier(.25,.23,.73,.75) infinite}
.dot{position:absolute;z-index:2;top:8px;left:calc(50% + 54px);width:6px;height:6px;border-radius:50%;background:#d5ffe2;box-shadow:0 0 12px rgba(117,240,162,.9);animation:ktl-dotMove 1800ms cubic-bezier(.25,.25,.75,.75) infinite}
.progress{display:flex;flex-direction:column;align-items:center;gap:9px}
.percent{font-size:clamp(1rem,3vw,1.35rem);font-weight:500;letter-spacing:.08em;font-variant-numeric:tabular-nums;color:#baf8d0}
.track{width:min(220px,60vw);height:2px;border-radius:5px;background:rgba(117,240,162,.15);overflow:hidden}
.bar{width:0;height:100%;background:linear-gradient(90deg,#34d878,#baf8d0);box-shadow:0 0 12px rgba(52,216,120,.6);transition:width .25s ease}
@keyframes ktl-dotMove{0%,100%{transform:rotate(180deg) translate(-80px,-10px) rotate(-180deg)}50%{transform:rotate(0deg) translate(-81px,10px) rotate(0deg)}}
@keyframes ktl-letterStretch{0%,100%{transform:scale(1,.35);transform-origin:100% 75%}8%,28%{transform:scale(1,1.4);transform-origin:100% 67%}37%{transform:scale(1,.875);transform-origin:100% 75%}46%{transform:scale(1,1.03);transform-origin:100% 75%}50%,97%{transform:scale(1);transform-origin:100% 75%}}
@media(min-width:560px){.kinetic{transform:scale(.9)}}
@media(prefers-reduced-motion:reduce){.dot,.letter-i{animation:none}.bar{transition:none}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
<main class="loader" aria-label="Pavithran26 portfolio loading">
  <div class="kinetic" role="img" aria-label="Pavithran26">
    <span class="dot" aria-hidden="true"></span>
    <p class="word" aria-hidden="true"><span class="letter">P</span><span class="letter">a</span><span class="letter">v</span><span class="letter">i</span><span class="letter">t</span><span class="letter letter-i">h</span><span class="letter">r</span><span class="letter">a</span><span class="letter">n</span><span class="letter">2</span><span class="letter">6</span></p>
  </div>
  <div class="progress" aria-live="polite">
    <span id="load-percent" class="percent">00%</span>
    <div class="track" aria-hidden="true"><div id="load-bar" class="bar"></div></div>
  </div>
</main>
<script>
(() => {
  const percent = document.getElementById('load-percent');
  const bar = document.getElementById('load-bar');
  let reportedReady = false;
  const update = value => {
    const n = Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
    percent.textContent = String(n).padStart(2,'0') + '%';
    bar.style.width = n + '%';
    if (n >= 100 && !reportedReady) {
      reportedReady = true;
      window.parent.postMessage({type:'speedometer-selftest-complete',speed:100},'*');
    }
  };
  window.addEventListener('message', event => {
    if (event.data?.type === 'portfolio-loading-progress') update(event.data.progress);
    if (event.data?.type === 'speedometer-request-progress') window.parent.postMessage({type:'speedometer-ready'},'*');
  });
  window.addEventListener('load', () => {
    window.parent.postMessage({type:'speedometer-ready'},'*');
    window.parent.postMessage({type:'speedometer-selftest-complete',speed:100},'*');
  });
  update(0);
  window.parent.postMessage({type:'speedometer-ready'},'*');
})();
</script>
</body>
</html>
