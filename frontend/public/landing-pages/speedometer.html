<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio Loading Workflow</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--green:#34d878;--mint:#baf8d0;--dim:#78a88b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#effff3}
body{display:grid;place-items:center;padding:12px}
.loader{width:min(100%,620px);min-height:390px;display:grid;place-items:center;position:relative;isolation:isolate}
.loader:before{content:"";position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(27,137,72,.2),rgba(4,22,13,.06) 48%,transparent 72%);filter:blur(12px);z-index:-1}
.workflow{width:min(100%,420px);aspect-ratio:1;position:relative;display:grid;place-items:center}
.ring{position:absolute;inset:7%;border:1px solid rgba(52,216,120,.16);border-radius:50%;box-shadow:0 0 45px rgba(37,199,99,.06),inset 0 0 35px rgba(37,199,99,.04)}
.ring.r2{inset:18%;border-style:dashed;border-color:rgba(117,240,162,.18);animation:orbit 42s linear infinite}
.ring.r3{inset:1%;border-color:rgba(117,240,162,.08)}
.orbit-path{position:absolute;inset:3%;width:94%;height:94%;overflow:visible;animation:orbit 28s linear infinite}
.orbit-path path{fill:none;stroke:rgba(117,240,162,.35);stroke-width:1.1;stroke-dasharray:3 8;stroke-linecap:round}
.orbit-path circle{fill:var(--green);filter:drop-shadow(0 0 5px rgba(117,240,162,.8))}
.center{z-index:2;width:36%;aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(117,240,162,.58);background:radial-gradient(circle at 35% 20%,rgba(31,92,53,.95),rgba(3,17,10,.98) 68%);box-shadow:0 0 0 7px rgba(117,240,162,.035),0 0 42px rgba(39,214,105,.17),inset 0 1px 0 rgba(255,255,255,.12)}
.percent{font-size:clamp(32px,7vw,52px);font-weight:650;letter-spacing:-.07em;line-height:1;font-variant-numeric:tabular-nums}
.center-label{margin-top:8px;color:#9bc8a9;font-size:9px;letter-spacing:.22em;text-transform:uppercase}
.node{position:absolute;z-index:3;width:27%;min-height:58px;display:flex;align-items:center;gap:9px;padding:10px;border:1px solid rgba(117,240,162,.25);border-radius:15px;background:linear-gradient(135deg,rgba(14,48,29,.95),rgba(4,18,11,.94));box-shadow:0 10px 28px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.06);transition:border-color .35s,background .35s,transform .35s}
.node .glyph{flex:0 0 28px;width:28px;height:28px;display:grid;place-items:center;border-radius:9px;color:var(--green);background:rgba(117,240,162,.1);font-size:15px}
.node strong{display:block;font-size:clamp(9px,1.8vw,12px);font-weight:650;letter-spacing:.015em;white-space:nowrap}
.node small{display:block;margin-top:4px;color:#80a88d;font-size:9px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.node.frontend{top:0;left:50%;transform:translateX(-50%)}
.node.backend{right:-1%;top:36%}
.node.database{bottom:0;left:50%;transform:translateX(-50%)}
.node.ai{left:-1%;top:36%}
.node.is-active{border-color:rgba(117,240,162,.8);background:linear-gradient(135deg,rgba(24,88,47,.98),rgba(4,26,14,.98));box-shadow:0 0 25px rgba(66,227,126,.14),inset 0 1px 0 rgba(255,255,255,.12)}
.node.is-active .glyph{background:rgba(117,240,162,.22);box-shadow:0 0 16px rgba(117,240,162,.12)}
.caption{position:absolute;bottom:-18px;left:0;right:0;text-align:center}
.caption strong{display:block;color:#e8fff0;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.caption span{display:block;margin-top:8px;color:#83a992;font-size:10px;letter-spacing:.05em}
.scan{position:absolute;inset:8%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 78%,rgba(117,240,162,.12) 91%,transparent 100%);animation:orbit 5s linear infinite;pointer-events:none}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.55;box-shadow:0 0 0 0 rgba(117,240,162,.12)}50%{opacity:1;box-shadow:0 0 0 5px rgba(117,240,162,.04)}}
@media(max-width:380px){.workflow{width:100%}.node{width:30%;padding:7px;gap:5px}.node .glyph{width:22px;height:22px;flex-basis:22px;font-size:12px}.node small{font-size:8px}.node strong{font-size:9px}.loader{min-height:330px}}
@media(prefers-reduced-motion:reduce){.ring.r2,.orbit-path,.scan{animation:none}.node{transition:none}}
</style>
</head>
<body>
<main class="loader" aria-label="Loading portfolio">
  <div class="workflow" role="img" aria-label="Radial workflow connecting frontend, backend, database, and AI service">
    <div class="ring r3"></div><div class="ring"></div><div class="ring r2"></div><div class="scan"></div>
    <svg class="orbit-path" viewBox="0 0 400 400" aria-hidden="true">
      <path d="M200 35 C285 35 365 105 365 200 C365 292 292 365 200 365 C108 365 35 292 35 200 C35 108 108 35 200 35Z"/>
      <path d="M200 82 C263 82 318 137 318 200 C318 263 263 318 200 318 C137 318 82 263 82 200 C82 137 137 82 200 82Z"/>
      <circle cx="200" cy="35" r="3"/><circle cx="365" cy="200" r="3"/><circle cx="200" cy="365" r="3"/><circle cx="35" cy="200" r="3"/>
    </svg>
    <div class="center"><span id="load-percent" class="percent">00%</span><span class="center-label">System load</span></div>
    <div class="node frontend is-active" data-step="0"><span class="glyph">⌘</span><span><strong>Frontend</strong><small>Interface</small></span></div>
    <div class="node backend" data-step="1"><span class="glyph">⌁</span><span><strong>Backend</strong><small>Services</small></span></div>
    <div class="node database" data-step="2"><span class="glyph">◈</span><span><strong>Database</strong><small>Data layer</small></span></div>
    <div class="node ai" data-step="3"><span class="glyph">✳</span><span><strong>AI Service</strong><small>Intelligence</small></span></div>
    <div class="caption"><strong id="load-status">Discover</strong><span>DISCOVER · BUILD · REVIEW · DELIVER</span></div>
  </div>
</main>
<script>
(() => {
  const percent = document.getElementById('load-percent');
  const status = document.getElementById('load-status');
  const nodes = [...document.querySelectorAll('[data-step]')];
  let current = 0;
  let reportedReady = false;
  const update = value => {
    const n = Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
    percent.textContent = String(n).padStart(2,'0') + '%';
    const step = n >= 92 ? 3 : n >= 68 ? 2 : n >= 36 ? 1 : 0;
    if (step !== current || !reportedReady) {
      current = step;
      nodes.forEach((node,i) => node.classList.toggle('is-active', i === step));
      status.textContent = ['Discover','Build','Review','Deliver'][n >= 100 ? 3 : step];
    }
    if (n >= 100 && !reportedReady) {
      reportedReady = true;
      window.parent.postMessage({type:'speedometer-selftest-complete',speed:100},'*');
    }
  };
  window.addEventListener('message', event => {
    if (event.data?.type === 'portfolio-loading-progress') update(event.data.progress);
    if (event.data?.type === 'speedometer-request-progress') window.parent.postMessage({type:'speedometer-ready'},'*');
  });
  window.addEventListener('load', () => {
    window.parent.postMessage({type:'speedometer-ready'},'*');
    window.parent.postMessage({type:'speedometer-selftest-complete',speed:100},'*');
  });
  update(0);
  window.parent.postMessage({type:'speedometer-ready'},'*');
})();
</script>
</body>
</html>
